# Codemagic iOS release for SH Rec.
# Requires App Store Connect integration + 3 App Store profiles (app + 2 extensions).

workflows:
  testFlight:
    name: "Ios Release"
    integrations:
      app_store_connect: Aymane Korai

    environment:
      flutter: 3.41.0
      ios_signing:
        # Named profiles only (do not mix with distribution_type + bundle_identifier).
        # Profiles must match:
        #   com.azrecorder.screenrecording
        #   com.azrecorder.screenrec.BroadcastExtension
        #   com.azrecorder.screenrecording.BroadcastUploadExtensionSetupUI
        # App Group: group.com.azrecorder.screenrecorder.sharedPreferences
        provisioning_profiles:
          - provisioning_shrec
          - provisioning_shrec_broadcast_extension
          - provisioning_shrec_broadcast_setup_ui
        certificates:
          - Certificate_aymane

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
          # Fail early if profiles were not applied (Automatic left = CI has no Apple account)
          if grep -q 'CODE_SIGN_STYLE = Automatic' ios/Runner.xcodeproj/project.pbxproj; then
            echo "ERROR: use-profiles did not switch targets to Manual signing."
            echo "Check Codemagic has App Store profiles for:"
            echo "  com.azrecorder.screenrecording"
            echo "  com.azrecorder.screenrec.BroadcastExtension"
            echo "  com.azrecorder.screenrecording.BroadcastUploadExtensionSetupUI"
            echo "Reference names must match provisioning_profiles in this yaml."
            exit 1
          fi

      - name: Fix extension entitlements paths after use-profiles
        script: bash ios/scripts/fix_extension_signing_paths.sh ios/Runner.xcodeproj/project.pbxproj

      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - impro19dev@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
